; DSN used by the integration tests (see test.env -> DSN='postgres').
;
; A STATIC DSN is possible because docker compose gives the database a stable
; hostname ("db") and port. This is what lets connect() work at all: it uses
; SQLConnectW, which accepts only a DSN name registered here -- never a
; host/port pair.
;
; The driver is referenced BY NAME. The `odbc-postgresql` package registers
; [PostgreSQL Unicode] in /etc/odbcinst.ini automatically, so a driver version
; bump needs no change here.
[postgres]
Description          = dart_odbc integration test DSN
Driver               = PostgreSQL Unicode
Servername           = db
Port                 = 5432
Database             = odbc_test
Username             = odbc_test
Password             = odbc_test

; Report BYTEA as SQL_LONGVARBINARY so isSQLTypeBinary() (helper.dart) takes the
; binary branch in result.dart and yields a Uint8List. Without this the value
; comes back as a String and binary_test.dart fails.
ByteaAsLongVarBinary = 1
BoolsAsChar          = 0
TextAsLongVarchar    = 1
MaxLongVarcharSize   = 8190

; Prepare client-side: untyped '?' parameters bind more predictably.
UseServerSidePrepare = 0
